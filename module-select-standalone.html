  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

l }}<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goNext }}\" style=\"pointer-events: {{ chromeEvents }}; display: flex; align-items: center; gap: 11px; padding: 13px 15px 13px 20px; border-radius: 14px; background: rgba(246,244,239,.14); border: 1.5px solid rgba(246,244,239,.42); backdrop-filter: blur(10px); box-shadow: 0 12px 30px -16px rgba(0,0,0,.7); color: {{ nextFg }}; font-size: 13.5px; font-weight: 500; cursor: {{ nextCursor }}; opacity: {{ nextOpacity }}; transition: background .22s ease, transform .22s cubic-bezier(.2,.85,.2,1), opacity .3s ease;\" style-hover=\"background: rgba(246,244,239,.26); border-color: #1CABE2; transform: translateX(4px);\">\n      <span style=\"display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25;\">\n        <span style=\"font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #9BA4B2;\">Next<\u002Fspan>\n        <span>{{ nextLabel }}<\u002Fspan>\n      <\u002Fspan>\n      <span style=\"font-size: 15px;\">→<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;angleStep&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:8,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;deg&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Wheel&quot;}}\">\nclass Component extends DCLogic {\n  MODULES = [\n    { kicker: \"Module one\", title: \"Digital footprints and privacy\", blurb: \"Placeholder summary. What a child leaves behind online, who can see it, and which settings matter most.\", accent: \"#1CABE2\", wash: \"linear-gradient(160deg, #F7F5F0 0%, #E4EFE9 100%)\", glow: \"rgba(28,171,226,.5)\" },\n    { kicker: \"Module two\", title: \"Scams, phishing and fake accounts\", blurb: \"Placeholder summary. How the common tricks look from a child's screen, and the habits that stop them working.\", accent: \"#8FA8FF\", wash: \"linear-gradient(160deg, #F5F5F2 0%, #E2E6F6 100%)\", glow: \"rgba(51,85,255,.42)\" },\n    { kicker: \"Module three\", title: \"Screen time, sleep and attention\", blurb: \"Placeholder summary. Agreements that hold, why sleep comes first, and what to do about the evening argument.\", accent: \"#FFB37A\", wash: \"linear-gradient(160deg, #F8F4EE 0%, #F3E3D4 100%)\", glow: \"rgba(255,150,90,.4)\" },\n    { kicker: \"Module four\", title: \"Cyberbullying: spotting it, responding\", blurb: \"Placeholder summary. The early signs, the difference between a fallout and bullying, and the first three steps.\", accent: \"#C9A6FF\", wash: \"linear-gradient(160deg, #F6F4F8 0%, #E8E1F4 100%)\", glow: \"rgba(140,100,240,.4)\" },\n    { kicker: \"Module five\", title: \"Talking with children about what they see\", blurb: \"Placeholder summary. Opening the conversation, keeping it open, and answering questions you were not ready for.\", accent: \"#7FDCE8\", wash: \"linear-gradient(160deg, #F3F6F7 0%, #DCEDF1 100%)\", glow: \"rgba(40,180,200,.42)\" }\n  ];\n\n  M1 = {\n    kicker: \"ՄՈԴՈՒԼ 1 · Ծնողական վերահսկողություն\",\n    lead: \"Քայլ առ քայլ՝ ինչպես կարգավորել ամեն սարքն ու հավելվածը, և ինչպես ապահովել անվտանգությունը՝ առանց վստահությունը կորցնելու։\",\n    steps: [\n      { label: \"Ներածություն\", title: \"Ինչի մասին է այս մոդուլը\", blocks: [\n        { k: \"p\", text: \"Այսօր շատ ծնողներ տեխնոլոգիաների արագ զարգացման հետևանքով իրենց անօգնական են զգում և հաճախ տեղյակ չեն այն գործիքներից, որոնք կարող են օգնել երեխաների համար ստեղծել անվտանգ թվային միջավայր։\" },\n        { k: \"h\", text: \"Հիմնական հարցը\" },\n        { k: \"p\", text: \"Ինչպե՞ս հետևել երեխայի առցանց գործունեությանը և ապահովել նրա անվտանգությունը՝ առանց անձնական տարածքը խախտելու և վստահությունը կորցնելու։ Հետազոտությունները հստակ պատասխան ունեն. ամենաարդյունավետը ոչ թե ամբողջական վերահսկողությունն է, այլ ակտիվ, բայց ինքնուրույնություն խրախուսող մոտեցումը։\" },\n        { k: \"h\", text: \"Նպատակ\" },\n        { k: \"p\", text: \"Մոդուլի նպատակն է համատեղել ծնողական հսկողությունը երեխայի ազատության հետ՝ պահպանելով ընտանեկան վստահության մթնոլորտը և խուսափելով ավելորդ լարվածությունից։ Մոդուլը կառուցված է երեք թեմայի շուրջ՝ ինչու է վերահսկողությունը կարևոր, ինչ գործիքներ կան ու ինչպես կարգավորել դրանք, և ինչպես պահպանել հավասարակշռությունը հսկողության ու վստահության միջև։ Ստորև նկարագրված են քայլ առ քայլ ուղեցույցներ ամեն համակարգի, հավելվածի, խաղի և մեսենջերի համար։\" },\n        { k: \"note\", title: \"Ինչպես օգտվել կարգավորումների բաժնից\", text: \"Կարգավորումների անվանումները տրված են բնագրով (անգլերեն), իսկ կողքին՝ ռուսերեն համարժեքը (օր.՝ Screen Time (рус. «Экранное время»)), որպեսզի հեշտ գտնեք դրանք ինչպես անգլերեն, այնպես էլ ռուսերեն ինտերֆեյսում։\" },\n        { k: \"h\", text: \"Թիրախային խումբ\" },\n        { k: \"p\", text: \"Ծնողներ և խնամակալներ\" }\n      ] },\n      { label: \"Ինչու է կարևոր\", title: \"Ինչու է վերահսկողությունը կարևոր\", blocks: [\n        { k: \"h\", text: \"Տարիքային ռիսկեր. յուրաքանչյուր փուլ՝ իր մարտահրավերներով\" },\n        { k: \"p\", text: \"Ճիշտ այնպես, ինչպես դաստիարակության մոտեցումը փոխվում է երեխայի աճին զուգահեռ, առցանց անվտանգության մոտեցումը նույնպես պետք է հարմարեցվի երեխայի ճանաչողական ու հուզական զարգացմանը։\" },\n        { k: \"table\", title: \"Տարիքային ռիսկերի աղյուսակ\", head: [\"Փուլ\", \"Հիմնական ռիսկեր\", \"Ուշադրության կենտրոնը\", \"Գործիքի շեշտը\"], rows: [\n          [\"Վաղ մանկություն (մինչև 8 տ.)\", \"Տարիքին անհարիր բովանդակություն, պատահական գնումներ\", \"Փակ, ապահով միջավայր, ուղեկցվող օգտագործում - սահմանափակ ժամանակ, միայն ծնողի ֆիզիկական վերահսկողության տակ\", \"Միայն ծնողի կողմից ֆիլտրած բովանդակություն\"],\n          [\"Դպրոցական տարիք (8–12 տ.)\", \"13+ հարթակներ վաղ տարիքում, անծանոթների շփում, in-app գնումներ\", \"Ընտանեկան կանոններ, համատեղ կարգավորում, ծնողի անձնական վերահսկողության ներքո\", \"Family Link / Screen Time, էկրանի ժամ, բոլոր գործողությունների հաստատում, ծնողի կողմից բովանդակության վերահսկում\"],\n          [\"Դեռահասություն (13+ տ.)\", \"Շանտաժ, ցածր ինքնագնահատական, ակտիվ սոցիալական ցանցեր. կախվածություն, ավելորդ տվյալների տարածում\", \"Բաց երկխոսություն, ինքնուրույնության աճ\", \"Teen Accounts, Family Pairing, ոչ թե վերահսկում\"]\n        ] },\n        { k: \"h\", text: \"Թվային միջավայրի մարտահրավերները\" },\n        { k: \"p\", text: \"8–12 տարեկանները ամենաարագ աճող խումբն են 13+ տարիքի համար նախատեսված հարթակներում, և հաճախ առերեսվում են ապատեղեկատվության, հավելվածներում գնումների ու անծանոթների շփման հետ՝ նախքան ընտանիքում հստակ կանոնների հաստատվելը։ Դեռահասներն ունեն ռիսկայնության այլ մակարդակ․ նրանք խոցելի են շանտաժի, անծանոթների ճնշման և սոցցանցերի հոգեբանական ազդեցության առջև։ Սա նշանակում է, որ մեխանիկական վերահսկողության փոխարեն անհրաժեշտ է այլ մոտեցում։\" }\n      ] },\n      { label: \"Համակարգեր\", title: \"Օպերացիոն համակարգեր\", blocks: [\n        { k: \"note\", title: \"Կանխարգելման առավելությունը\", text: \"Նախապես պաշտպանելը շատ ավելի արդյունավետ է, քան հետևանքների դեմ պայքարելը։ Կարգավորումները տեղադրեք նախքան երեխային սարք տալը, ոչ թե խնդրի առաջանալուց հետո։\" },\n        { k: \"p\", text: \"Բոլոր ժամանակակից սարքերն ունեն անվճար, հզոր ծնողական վերահսկողության գործիքներ։ Ստորև՝ քայլ առ քայլ ուղեցույց ամեն համակարգի, սոցիալական ցանցի, խաղի և մեսենջերի համար։ Կարգավորման անվանումները տրված են անգլերեն (ինչպես սարքում), ռուսերեն համարժեքը՝ փակագծում։\" },\n        { k: \"guide\", name: \"iPhone / iPad (iOS)\", sub: \"Screen Time (рус. «Экранное время»)\", steps: [\n          \"Ձեր սարքում բացեք Settings › Family (рус. «Настройки › Семья») և կարգավորեք Family Sharing (рус. «Семейный доступ»)՝ ավելացնելով երեխայի Apple հաշիվը (մինչև 6 անդամ)։\",\n          \"Անցեք Settings › Screen Time (рус. «Настройки › Экранное время»), ընտրեք երեխայի անունը և միացրեք Screen Time։\",\n          \"Դրեք Screen Time passcode (рус. «код-пароль для Экранного времени»), որը երեխան չգիտի։\",\n          \"Բացեք Content & Privacy Restrictions (рус. «Контент и конфиденциальность») և միացրեք այն։\",\n          \"iTunes & App Store Purchases (рус. «Покупки в iTunes и App Store»)՝ «Installing Apps» (рус. «Установка приложений») և «Deleting Apps» (рус. «Удаление приложений»)՝ Don't Allow (рус. «Нет»), «In-app Purchases» (рус. «Встроенные покупки»)՝ Don't Allow (рус. «Нет»)։\",\n          \"Content Restrictions (рус. «Ограничения контента»)՝ «Web Content» (рус. «Веб-содержимое»)՝ Limit Adult Websites (рус. «Лимит сайтов для взрослых»), դրեք տարիքային ցենզ (рус. «возрастной ценз») ֆիլմերի (рус. «Фильмы»), հավելվածների (рус. «Программы») ու երաժշտության (рус. «Музыка, подкасты, новости») համար։\",\n          \"Միացրեք Ask to Buy (рус. «Попросить купить»)՝ Settings › Family › [երեխա] › Ask To Buy (рус. «Настройки › Семья › [ребёнок] › Попросить купить»)՝ գնումները հաստատման ենթարկելու համար։\",\n          \"Միացրեք Communication Safety (рус. «Безопасность общения»)՝ մերկ պատկերների ավտոմատ հայտնաբերման համար։\",\n          \"Կարգավորեք Downtime (рус. «В покое») և App Limits (рус. «Лимиты приложений»)՝ ժամային սահմանների համար։\"\n        ] },\n        { k: \"guide\", name: \"Mac (macOS)\", sub: \"Screen Time (рус. «Экранное время»)\", steps: [\n          \"Համոզվեք, որ երեխան ունի առանձին օգտատիրոջ հաշիվ և ընդգրկված է նույն Family Sharing (рус. «Семейный доступ») խմբում։\",\n          \"Բացեք System Settings › Screen Time (рус. «Системные настройки › Экранное время»), ընտրեք երեխայի հաշիվը։\",\n          \"Միացրեք Content & Privacy (рус. «Контент и конфиденциальность») և կիրառեք նույն սահմանափակումները, ինչ iOS-ում (վեբ-բովանդակություն, գնումներ, տարիքային ցենզ)։\",\n          \"Դրեք Screen Time passcode (рус. «код-пароль Экранного времени») և կարգավորեք Downtime/App Limits։ macOS-ի և iOS-ի Screen Time-ը համաժամանակեցվում է նույն Apple հաշվի ներքո։\"\n        ] },\n        { k: \"guide\", name: \"Android\", sub: \"Google Family Link (рус. «Родительский контроль Family Link»)\", steps: [\n          \"Ձեր հեռախոսին տեղադրեք Google Family Link հավելվածը (App Store / Google Play)։\",\n          \"Բացեք հավելվածն ու ստեղծեք ընտանեկան խումբ. ավելացրեք երեխայի Google հաշիվը կամ ստեղծեք նորը (Supervise account, рус. «Контролировать аккаунт»)։\",\n          \"Երեխայի սարքում՝ Settings › Google › Parental controls (рус. «Настройки › Google › Родительский контроль»), կապեք հաշիվը՝ մուտքագրելով ձեր էլ. փոստն ու գաղտնաբառը։\",\n          \"Family Link-ում կարգավորեք՝ App access (рус. «Доступ к приложениям»)՝ նոր հավելվածների հաստատում, Screen time / Daily limit (рус. «Время использования / Дневной лимит»), Bedtime (рус. «Время сна»)։\",\n          \"Միացրեք Content filters (рус. «Фильтры контента»)՝ Google Search-ի, Chrome-ի և YouTube-ի համար։\",\n          \"Միացրեք գնումների հաստատումը Google Play-ում (рус. «Подтверждение покупок»)։\",\n          \"Android 16-ից (2025 դեկ.) կան նաև ներկառուցված parental controls (рус. «встроенный родительский контроль»). երեխայի սարքում՝ Settings › Parental controls, PIN-ով պաշտպանված, ներառյալ Website content filters (рус. «Фильтры контента сайтов»)։\"\n        ] },\n        { k: \"guide\", name: \"Windows 11\", sub: \"Microsoft Family Safety (рус. «Семейная безопасность Microsoft»)\", steps: [\n          \"Ստեղծեք երեխայի համար Microsoft account (рус. «учётная запись Microsoft») և ավելացրեք ընտանեկան խմբին՝ Settings › Accounts › Family (рус. «Параметры › Учётные записи › Семья»)։\",\n          \"Երեխայի համակարգչում նա պետք է մուտք գործի իր Microsoft հաշվով, ոչ թե տեղական (local) հաշվով, այլապես վերահսկողությունը չի աշխատի։\",\n          \"Բացեք family.microsoft.com կամ Family Safety հավելվածը և ընտրեք երեխայի հաշիվը։\",\n          \"Screen time (рус. «Время использования»)՝ միացրեք սահմանները սարքերի ու հավելվածների համար։\",\n          \"Content filters (рус. «Фильтры контента»)՝ Microsoft Edge-ում միացրեք վեբ-ֆիլտրումը ըստ կատեգորիայի, արգելեք մեծահասակների կայքերը։\",\n          \"Spending (рус. «Расходы»)՝ միացրեք «Require approval for purchases» (рус. «Запрашивать подтверждение покупок»)։\",\n          \"Նույն կարգավորումներն ինքնաշխատ տարածվում են Xbox-ի վրա, երբ երեխան մտնում է նույն հաշվով։\"\n        ] }\n      ] },\n      { label: \"Սոցիալական ցանցեր\", title: \"Սոցիալական հավելվածներ\", blocks: [\n        { k: \"p\", text: \"Սոցիալական ցանցերի դեպքում հարկավոր է գիտակցել, որ հիմնական հարթակներում ընդհանրապես արգելվում է մինչև 13 տարեկանների գրանցումը։ Իսկ ավելի մեծ տարիքում վերահսկողությունը գործում է այն դեպքում, եթե երեխան նշել է իր իրական տարիքը։ Ստուգեք ստորև առաջարկվող հարթակները երեխայի անվտանգության երաշխավորման համար։\" },\n        { k: \"guide\", name: \"YouTube\", sub: \"YouTube Kids / Supervised / Restricted Mode\", steps: [\n          \"Մինչև 8 տ.՝ օգտագործեք YouTube Kids (рус. «YouTube Детям»)՝ առանձին հավելված. ընտրեք տարիքային կատեգորիան ստեղծելիս։ Այս պահին Հայաստանում այն դեռ չի գործում, սակայն կա հավանականություն, որ մոտակա ժամանակներում իրավիճակը կարող է փոխվել։\",\n          \"8 տ.-ից բարձր՝ Family Link-ով ստեղծեք Supervised account (рус. «Аккаунт с родительским контролем»). Family Link › [երեխա] › Controls › YouTube՝ ընտրեք բովանդակության մակարդակը։\",\n          \"Հիմնական YouTube-ում միացրեք Restricted Mode (рус. «Безопасный режим»)՝ Profile › Settings › General › Restricted Mode › On։\",\n          \"Պարբերաբար ստուգեք Watch history (рус. «История просмотра»)՝ տեսնելու, թե իրականում ինչ է դիտվում։ Իսկ ավելի գերադասելի է, որպեսզի դուք մինչև 12 տարեկանը վերահսկեք ողջ բովանդակությունը։\"\n        ] },\n        { k: \"guide\", name: \"Instagram\", sub: \"Teen Accounts (рус. «Подростковые аккаунты») / Family Center\", steps: [\n          \"13–17 տ. հաշիվներն ինքնըստինքյան դառնում են Teen Account՝ ամենախիստ կարգավորմամբ (մասնավոր ռեժիմ, բովանդակության ֆիլտր). մինչև 16 տ.-ի համար փոփոխությունները պահանջում են ծնողի համաձայնություն։\",\n          \"Թարմացրեք Instagram հավելվածը և՛ ձեր, և՛ երեխայի սարքում (պետք է ունենաք Instagram հաշիվ)։\",\n          \"Բացեք Family Center (рус. «Семейный центр»)՝ Profile › ☰ menu › Family Center։\",\n          \"Ուղարկեք հրավեր երեխային (կամ նա՝ ձեզ). երկու կողմն էլ պետք է հաստատեն կապը։\",\n          \"Կարգավորեք daily time limit (рус. «дневной лимит времени»), տեսեք, թե ով կարող է գրել երեխային, և ստացեք ծանուցում, երբ նա բողոքարկում է բովանդակություն։ Հսկողությունը երեխան պետք է հաստատի և կարող է հանել. դրա համար կարևոր է բաց զրույցը։\"\n        ] },\n        { k: \"guide\", name: \"TikTok\", sub: \"Family Pairing (рус. «Семейный режим»)\", steps: [\n          \"Ձեր TikTok հաշվում բացեք Profile › ☰ › Settings and privacy (рус. «Профиль › Настройки и конфиденциальность»)։\",\n          \"Ընտրեք Family Pairing (рус. «Семейный режим»), սեղմեք Continue և ընտրեք «Parent» դերը՝ ստանալով QR կոդ։\",\n          \"Երեխայի սարքում բացեք նույն Family Pairing բաժինը, ընտրեք «Teen» և սկանավորեք QR կոդը՝ կապը հաստատելու համար։\",\n          \"Կարգավորեք՝ Screen Time (рус. «Время использования»), Restricted Mode (рус. «Ограниченный режим»), ով կարող է գրել, և Time Away (рус. «Перерыв»)՝ դպրոցի ժամերին հասանելիությունն արգելելու համար։\"\n        ] },\n        { k: \"guide\", name: \"Snapchat\", sub: \"Family Center (рус. «Семейный центр»)\", steps: [\n          \"Ձեր հեռախոսին տեղադրեք Snapchat-ը և մտեք ձեր հաշիվ (և՛ դուք, և՛ երեխան պետք է ունենաք հաշիվ)։\",\n          \"Պրոֆիլից սեղմեք Add Friends (рус. «Добавить друзей»)՝ ավելացնելով երեխային օգտանունով։\",\n          \"Settings (рус. «Настройки») › Privacy Controls › Family Center (рус. «Конфиденциальность › Семейный центр»)։\",\n          \"Ընտրեք երեխայի անունը › Send Invitation (рус. «Отправить приглашение»)։ Երեխան իր սարքում սեղմում է View Invitation › Accept (рус. «Принять»)։\",\n          \"Կտեսնեք ընկերների ցանկը, վերջին 7 օրվա շփումները (առանց բովանդակության), նոր ընկերներն ու օրական միջին ժամանակը։\",\n          \"Content Controls (рус. «Контроль контента»)՝ սահմանափակեք բովանդակությունը Stories-ում և Spotlight-ում։\",\n          \"Անջատեք My AI-ը և միացրեք Snap Map › Ghost Mode (рус. «Режим невидимки»)՝ երեխայի տեղը, գեոլոկացիան մյուս օգտատերերից թաքցնելու համար։\"\n        ] }\n      ] },\n      { label: \"Խաղեր և կոնսոլներ\", title: \"Խաղեր և կոնսոլներ\", blocks: [\n        { k: \"guide\", name: \"Roblox\", sub: \"Parental Controls (рус. «Родительский контроль»)\", steps: [\n          \"Հաշիվ ստեղծելիս մուտքագրեք երեխայի ճիշտ ծննդյան ամսաթիվը (рус. «правильную дату рождения»). մինչև 13 տ. հաշիվներն ինքնաշխատ ստանում են ավելի խիստ սահմանափակումներ։\",\n          \"Որպես հաշվի էլ. փոստ նշեք ծնողի էլ. փոստը (рус. «родительскую почту») և դրեք Parent PIN (рус. «родительский PIN-код»)՝ Settings › Parental Controls։\",\n          \"Միացրեք Content Maturity / Allowed Experiences (рус. «Ограничение по возрасту контента»)՝ ըստ երեխայի տարիքի։\",\n          \"Կարգավորեք Communication / Chat (рус. «Общение / Чат»)՝ սահմանափակեք կամ անջատեք չատը անծանոթների հետ։\",\n          \"Ժամային սահմանի համար օգտագործեք սարքի մակարդակի գործիքը (Screen Time / Family Link), քանի որ Roblox-ն ինքը ժամային սահման չունի։\"\n        ] },\n        { k: \"guide\", name: \"PlayStation 5\", sub: \"Family and Parental Controls (рус. «Семья и родительский контроль»)\", steps: [\n          \"Ստեղծեք ձեր՝ որպես Family Manager (рус. «Управляющий семьёй») հաշիվը, ապա ավելացրեք երեխային՝ կոնսոլում Settings › Family and Parental Controls › Family Management (рус. «Настройки › Семья и родительский контроль › Управление семьёй») կամ playstation.com/acct/family-ից։\",\n          \"Մուտքագրեք երեխայի ճիշտ ծննդյան ամսաթիվը՝ տարիքին համապատասխան լռելյայն սահմանափակումների համար։\",\n          \"Playtime Settings (рус. «Настройки игрового времени»)՝ միացրեք Restrict Playtime՝ ժամային սահման դնելու համար (PlayStation Family հավելվածով կարող եք կառավարել հեռակա)։\",\n          \"Age Level for Games / Apps (рус. «Возрастной уровень для игр»)՝ դրեք բովանդակության տարիքային ցենզ։\",\n          \"Communication & User-Generated Content (рус. «Общение и пользовательский контент»)՝ սահմանափակեք չատն ու անծանոթների հետ շփումը (օր.՝ Solo and Focused)։\",\n          \"Monthly Spending Limit (рус. «Месячный лимит расходов»)՝ դրեք 0 կամ ցանկալի սահման. դրամը վերցվում է Family Manager-ի դրամապանակից։\",\n          \"Դրեք System Restrictions passcode (рус. «PIN ограничений системы») և փոխեք լռելյայն 0000-ը, անջատեք նոր օգտատերերի ստեղծումն ու հյուրի մուտքը։\"\n        ] },\n        { k: \"guide\", name: \"Xbox Series X | S\", sub: \"Family Settings (рус. «Семейные настройки»)\", steps: [\n          \"Տեղադրեք Xbox Family Settings հավելվածը (iOS / Android) կամ կոնսոլում անցեք Settings › Account › Family (рус. «Настройки › Учётная запись › Семья»)։\",\n          \"Ստեղծեք երեխայի համար առանձին Microsoft account և ավելացրեք ընտանեկան խմբին (դուք՝ Organizer, рус. «Организатор»)։\",\n          \"Կոնսոլում միացրեք Online safety & family › Family settings (рус. «Безопасность в сети и семья › Семейные настройки») և դրեք PIN։\",\n          \"Content restrictions (рус. «Ограничения контента»)՝ դրեք տարիքային ցենզ խաղերի ու հավելվածների համար։\",\n          \"Privacy & online safety › Xbox privacy (рус. «Конфиденциальность и безопасность в сети»)՝ սահմանափակեք չատը, multiplayer-ն ու cross-network շփումը։\",\n          \"Spending / Ask a parent (рус. «Расходы / Спросить родителя»)՝ միացրեք գնումների հաստատումն ու ծախսերի ծանուցումը։\",\n          \"Դրեք passkey (рус. «код доступа»)՝ կոնսոլում կարգավորումներն ու գնումները պաշտպանելու համար։\"\n        ] },\n        { k: \"guide\", name: \"Nintendo Switch\", sub: \"Parental Controls (рус. «Родительский контроль»)\", steps: [\n          \"Տեղադրեք Nintendo Switch Parental Controls հավելվածը (iOS / Android) ձեր հեռախոսին և կապեք կոնսոլի հետ՝ ստանալով գրանցման կոդ։\",\n          \"Դրեք Parental Controls PIN (рус. «PIN-код родительского контроля»). ուշադրություն՝ սահմանափակումները կիրառվում են ամբողջ կոնսոլի վրա, ոչ թե առանձին օգտատիրոջ, ուստի դրեք ամենափոքր երեխայի հաշվով։\",\n          \"Հավելվածում դրեք Restriction Level / age (рус. «Уровень ограничений / возраст»)՝ խաղերի տարիքային ցենզի համար։\",\n          \"Կարգավորեք Play-time limit (рус. «Ограничение игрового времени») և Bedtime Alarm (рус. «Будильник ко сну»)։\",\n          \"Կոնսոլում՝ System Settings › Parental Controls (рус. «Настройки консоли › Родительский контроль»). հաշվի eShop-ի և գնումների սահմանափակումը կարգավորեք Nintendo հաշվի ընտանեկան խմբից։\"\n        ] }\n      ] },\n      { label: \"Մեսենջերներ\", title: \"Մեսենջերներ\", blocks: [\n        { k: \"guide\", name: \"Discord\", sub: \"Family Center (рус. «Семейный центр»)\", steps: [\n          \"Տեղադրեք Discord հավելվածը ձեր հեռախոսին (կապը հաստատելու համար անհրաժեշտ է հեռախոս՝ QR կոդ սկանավորելու համար)։\",\n          \"Բացեք User Settings › Family Center (рус. «Настройки пользователя › Семейный центр»)։\",\n          \"Սեղմեք Connect with Teen (рус. «Связаться с подростком») և սկանավորեք երեխայի սարքում Family Center-ից ստեղծված QR կոդը. երեխան պետք է հաստատի։\",\n          \"Կապից հետո կտեսնեք գործունեության ամփոփումը՝ ընկերներ, սերվերներ, ում հետ է շփվում (հաղորդագրությունների բովանդակությունը չի երևում)։\",\n          \"Երեխայի հաշվում միացրեք անվտանգության կարգավորումները՝ Privacy & Safety (рус. «Конфиденциальность и безопасность»)՝ ընտրեք բովանդակության ֆիլտրը (Keep Me Safe, рус. «Сканировать весь контент»)։\",\n          \"Message Requests / DM spam filter (рус. «Запросы сообщений / Фильтр спама в личных сообщениях»)՝ միացրեք «Filter from non-friends»՝ անծանոթներից հաղորդագրությունները զտելու համար։\",\n          \"Friend Requests (рус. «Запросы в друзья»)՝ ընտրեք Friends of Friends կամ No One՝ անծանոթներից հարցումներն արգելելու համար։\"\n        ] }\n      ] },\n      { label: \"Գործնական քայլաշար\", title: \"Գործնական քայլաշար\", blocks: [\n        { k: \"p\", text: \"Սարքավորումների ընդհանուր հաջորդականություն (checklist)։ Նշեք կատարվածը՝ ձեր ընտանիքի համար։\" },\n        { k: \"check\", items: [\n          \"Ստեղծեք ընտանեկան խումբ. Family Sharing (Apple) / Family Link (Google) / Microsoft Family՝ ձեր և երեխայի հաշիվներով։\",\n          \"Դրեք ծնողական գաղտնակոդ/PIN, որը երեխան չգիտի, ամեն համակարգում և կոնսոլում։\",\n          \"Միացրեք բովանդակության ֆիլտրերն ու տարիքային ցենզը (Safari/Chrome/Edge, App Store/Play, խաղեր)։\",\n          \"Միացրեք գնումների հաստատումը (Ask to Buy / Family Link / Microsoft Store / PlayStation / Xbox)։\",\n          \"Սահմանեք էկրանի ժամ և քնի ռեժիմ՝ ճկուն աշխատանքային/հանգստյան օրերի համար։\",\n          \"Կարգավորեք ամեն հավելվածի ու կոնսոլի ներքին պաշտպանությունը (TikTok, Instagram, Snapchat, YouTube, Roblox, PlayStation, Xbox, Discord)։\",\n          \"Ստուգեք պարբերաբար. կարգավորումներն աշխատում են միայն, երբ բոլորը միացված են և թարմացվում են. վերանայեք դրանք տարին մեկ-երկու անգամ՝ երեխայի աճին զուգահեռ։\"\n        ] }\n      ] },\n      { label: \"Վստահություն\", title: \"Հավասարակշռություն և փոխվստահություն\", blocks: [\n        { k: \"h\", text: \"Հսկողություն և վստահություն. ինչ է ասում հետազոտությունը\" },\n        { k: \"p\", text: \"Գործիքները կարևոր են, բայց դրանք միջոց են, ոչ թե նպատակ։ Հետազոտությունները ցույց են տալիս, որ ինքնուրույնություն խրախուսող, ակտիվ վերահսկողությունը (կանոններ + բաց երկխոսություն + աստիճանական ազատություն) ավելի դրական արդյունք է տալիս, քան վերահսկող, սահմանափակող մոտեցումը, որը կապված է մեդիայի խնդրահարույց օգտագործման ու դեռահասի ավելի խնդրահարույց վարքի հետ։ Չափից շատ վերահսկող ու ճնշող մեթոդները երեխաների կողմից ընկալվում են ծայրահեղ բացասական և կարող են վնասել ընտանեկան հարաբերություններն ու վստահությունը՝ խաթարելով հենց պաշտպանական նպատակը։\" },\n        { k: \"h\", text: \"Կանոնների շուրջ պայմանավորվել. ինչ ասել և ինչ չասել\" },\n        { k: \"pair\", title: \"Ինչ ասել և ինչ չասել\", doTitle: \"Ինչ ասել\", dontTitle: \"Ինչ չասել\", doItems: [\n          \"«Այս կանոնները քեզ պաշտպանելու համար են, ոչ թե քեզ վերահսկելու. արի միասին որոշենք»։\",\n          \"«Ի՞նչ խաղ ես հիմա ամենաշատը խաղում. ցույց տուր»։ (հանգիստ, հետաքրքրությամբ)\",\n          \"«Երբ մեծանաս և ցույց տաս, որ կարող ես ինքնուրույն կառավարել, սահմանափակումները կթուլացնենք»։\",\n          \"«Եթե առցանց տհաճ բանի հանդիպես, ինձ կարող ես ասել առանց պատժի վախի»։\"\n        ], dontItems: [\n          \"«Ես ամեն ինչ կտեսնեմ, ինչ անում ես հեռախոսում»։\",\n          \"«Որովհետև ես այդպես եմ ասում»։ (առանց բացատրության)\",\n          \"«Քեզ չեմ վստահում, դրա համար եմ ստուգում»։\"\n        ] },\n        { k: \"p\", text: \"Կանոնները լավագույնս աշխատում են, երբ երեխան մասնակցում է դրանց ձևակերպմանը. ընդգրկվածությունը մեծացնում է կանոնը պահպանելու հավանականությունը։\" },\n        { k: \"h\", text: \"Թվային սահմաններ՝ առանց վեճերի\" },\n        { k: \"p\", text: \"Գրավոր «մեդիա-համաձայնագիրը» օգնում է կանոնները դարձնել ընդհանուր որոշում, ոչ թե պարտադրանք. էկրանի ժամ, քնելուց առաջ սարք չօգտագործելու կանոն, ինչը կարելի է կիսվել և ինչը՝ ոչ։ Վերանայեք այն պարբերաբար՝ երեխայի աճին համապատասխան։\" },\n        { k: \"list\", items: [\n          \"Կանոնավոր ստուգում, ոչ թե հարցաքննություն. «Ի՞նչ հետաքրքիր բան տեսար այս շաբաթ» ձևաչափը պահպանում է բաց հաղորդակցությունը։\",\n          \"Դրական արձագանք. նկատեք և գնահատեք, թե ինչ է երեխան լավ անում առցանց, ոչ միայն սխալները։\",\n          \"Թափանցիկություն. երեխան պետք է իմանա, ինչ եք վերահսկում և ինչու. թաքնված հսկողությունը, երբ բացահայտվում է, կործանում է վստահությունը։\"\n        ] },\n        { k: \"h\", text: \"Ազատության աստիճանական ընդլայնում\" },\n        { k: \"p\", text: \"Սահմանափակումները չպետք է հանվեն միանգամից, այլ աստիճանաբար՝ երեխայի հասունացմանը զուգահեռ։ Ավելի մեծ դեռահասներին պետք է հնարավորություն տալ ավելի շատ ինքնուրույնություն դրսևորելու առցանց տիրույթում՝ պահպանելով հիմնական լռելյայն պաշտպանությունները։ Կիրառելի և ընդունելի մեդիա-պլանը շարունակ զարգացրեք՝ ավելի մեծ ինքնուրույնության հաշվառմամբ. սա ամրապնդում է վստահությունն ու բաց հաղորդակցությունը։\" },\n        { k: \"note\", title: \"Ոսկե կանոնը\", text: \"Տեխնոլոգիան միշտ ավելի արագ է զարգանում, քան ցանկացած վերահսկողության համակարգ։ Երեխան, ով հասկանում է կանոնների պատճառը, ավելի լավ է պաշտպանված, քան նա, ում սարքը պարզապես կողպված է. զրույցն ավելի կարևոր է, քան կարգավորումը։ Իհարկե, կարևոր է նաև, որ մեծահասակն ինքը հետաքրքրվի նորարարություններով և տեղյակ լինի, թե ինչ հարթակներով, ինտերնետ հավելվածներով է հետաքրքրված երեխան։\" }\n      ] },\n      { label: \"Օգնություն\", title: \"Շտապ օգնություն և լրացուցիչ ընթերցանություն\", blocks: [\n        { k: \"h\", text: \"Որտեղ դիմել\" },\n        { k: \"p\", text: \"Հիշեք՝ ոչ մի երեխա չպետք է միայնակ մնա առցանց վտանգերի ենթարկվելիս։\" },\n        { k: \"links\", items: [\n          { title: \"CyberChat — երեխաների համար\", meta: \"chat.cyberhub.am · 055 228811 — Տեխնիկական, իրավական և հոգեբանական աջակցություն, 24/7 անանուն չատ։\" },\n          { title: \"Ոստիկանություն 102 — արտակարգ դեպքեր\", meta: \"Հաղորդման ներկայացում առցանց հանցագործությունների վերաբերյալ։\" },\n          { title: \"Internet Matters — քայլ առ քայլ ուղեցույցներ\", meta: \"internetmatters.org/parental-controls — Անվճար, թարմացվող ուղեցույցներ բոլոր սարքերի ու հավելվածների համար։\" }\n        ] },\n        { k: \"h\", text: \"Օգտակար նյութեր՝ հայերեն և ռուսերեն\" },\n        { k: \"links\", items: [\n          { title: \"UNICEF Հայաստան — «Երեխաները և թվային աշխարհը»\", meta: \"Ծնողահեն հանգույց՝ բաց երկխոսության, սահմանների և առցանց անվտանգության շուրջ։ unicef.org/armenia\" },\n          { title: \"CyberChat / CyberHUB-AM\", meta: \"Հայաստանյան հարթակ՝ տեխնիկական, իրավական և հոգեբանական աջակցությամբ։ chat.cyberhub.am\" },\n          { title: \"ЮНИСЕФ (ECA) — «Защита детей в интернете»\", meta: \"О балансе доверия и контроля, рисках и онлайн-безопасности. unicef.org/eca/ru\" },\n          { title: \"Kaspersky — «Руководство по родительскому контролю»\", meta: \"Пошаговая настройка для iPhone, Android, Windows и YouTube. kaspersky.ru\" },\n          { title: \"Линия помощи «Дети онлайн» / Фонд Развития Интернет\", meta: \"Материалы для родителей (телефон 8-800-25-000-15 — только для России). detionline.com\" }\n        ] },\n        { k: \"note\", title: \"Նշում Հայաստանի համար\", text: \"Ռուսալեզու «Дети онлайн» թեժ գիծը ՌԴ-ի համար է. նյութերը կարդալ կարելի է ցանկացած երկրից։ Հայաստանում տեղական օգնության կետերն են CyberChat-ը (chat.cyberhub.am · 055 228811) և ոստիկանությունը (102)։\" },\n        { k: \"h\", text: \"Աջակցող նյութեր\" },\n        { k: \"links\", items: [\n          { title: \"ԿիբեռՉատի փոդքաստ. Երեխաները կիբեռհարձակումների թիրախում\", meta: \"Սամվել Մարտիրոսյան, Հայկ Մկրտչյան — դիտել փոդքաստը\" },\n          { title: \"Ծնողական վերահսկման հավելվածների բացասական կողմը․ առողջ սահմաններ\", meta: \"Կարդալ բլոգը\" }\n        ] },\n        { k: \"p\", text: \"Մոդուլի յուրաքանչյուր հիմնական պնդում և կարգավորման քայլ հիմնված է ստորև բերված աղբյուրների վրա։\" },\n        { k: \"list\", items: [\n          \"American Academy of Pediatrics (AAP) — Balancing Online Safety and Independence: Parental Monitoring by Age. aap.org\",\n          \"Our Rescue — Why Age-Appropriate Online Safety Conversations Matter (developmental stages). ourrescue.org\",\n          \"National Parenting Authority — Child Safety at Home and Online. nationalparentingauthority.com\",\n          \"NTIA (US Dept. of Commerce) — Kids Online Health and Safety report 2024. ntia.gov (PDF)\",\n          \"Internet Matters — Parental controls hub (step-by-step guides, all platforms). internetmatters.org\",\n          \"Apple Support — Use parental controls on your child's iPhone or iPad. support.apple.com\",\n          \"Apple Support — Use Screen Time on Mac, iPhone & iPad. support.apple.com\",\n          \"Internet Matters — Android smartphone parental controls (Android 16 built-in). internetmatters.org\",\n          \"Google — Family Link (family safety & parental control tools). families.google\",\n          \"Microsoft — Family Safety. microsoft.com\",\n          \"Internet Matters — TikTok privacy & safety settings (Family Pairi րեխան չգիտի\", \"Գնումների հաստատման միացում\", \"Երեխայի գաղտնաբառերի հավաքում\"], correct: [0, 1, 2],\n      section: 6, why: \"Checklist-ը տեխնիկական քայլերի մասին է. գաղտնաբառեր հավաքելը վստահության խնդիր է ստեղծում։\" },\n    { prompt: \"Հայաստանում երեխաների համար 24/7 անանուն աջակցության հարթակը՝\", kind: \"choice\",\n      options: [\"Internet Matters\", \"CyberChat\", \"Дети онлайн\", \"Family Center\"], correct: 1,\n      section: 8, why: \"CyberChat՝ chat.cyberhub.am · 055 228811։ Արտակարգ դեպքերում՝ 102։\" }\n  ];\n\n  finalStep() { return this.M1.steps.length; }\n  isFinalStep(step) { return step === this.finalStep(); }\n  finalPassed() { return this.state.fDone === true; }\n\n  submitFinal() {\n    const i = this.state.fIdx || 0;\n    const q = this.FINAL[i];\n    const sel = this.state.fSel;\n    let ok = false;\n    if (q.kind === \"tf\") ok = sel === q.answer;\n    else if (q.kind === \"choice\") ok = sel === q.correct;\n    else ok = (sel || []).slice().sort().join(\",\") === q.correct.slice().sort().join(\",\");\n    this.setState(prev => ({\n      fStatus: ok ? \"ok\" : \"bad\",\n      qShake: ok ? prev.qShake : prev.qShake + 1,\n      fWrong: ok ? prev.fWrong : Object.assign({}, prev.fWrong, { [i]: true })\n    }));\n  }\n\n  nextFinal() {\n    const i = this.state.fIdx || 0;\n    if (i + 1 < this.FINAL.length) this.setState({ fIdx: i + 1, fSel: null, fStatus: null });\n    else this.setState({ fDone: true, fStatus: null });\n    const el = document.getElementById(\"m1-scroll\");\n    if (el) el.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  quizPassed(step) {\n    if (this.isFinalStep(step)) return this.finalPassed();\n    return this.state.qStatus[step] === \"ok\";\n  }\n\n  submitQuiz(step) {\n    const q = this.QUIZ[step];\n    const sel = this.state.qSel[step];\n    let ok = false;\n    if (q.kind === \"tf\") ok = sel === q.answer;\n    else if (q.kind === \"choice\") ok = sel === q.correct;\n    else if (q.kind === \"multi\") {\n      const a = (sel || []).slice().sort().join(\",\");\n      ok = a === q.correct.slice().sort().join(\",\");\n    }\n    this.setState(prev => ({\n      qStatus: Object.assign({}, prev.qStatus, { [step]: ok ? \"ok\" : \"bad\" }),\n      qShake: ok ? prev.qShake : prev.qShake + 1\n    }));\n  }\n\n  pickOrder(step, i) {\n    const q = this.QUIZ[step];\n    const cur = this.state.qOrder[step] || [];\n    if (cur.indexOf(i) >= 0 || this.state.qStatus[step] === \"ok\") return;\n    if (q.order[cur.length] !== i) {\n      this.setState(prev => ({ qOrder: Object.assign({}, prev.qOrder, { [step]: [] }), qStatus: Object.assign({}, prev.qStatus, { [step]: \"bad\" }), qShake: prev.qShake + 1 }));\n      return;\n    }\n    const next = cur.concat([i]);\n    this.setState(prev => ({\n      qOrder: Object.assign({}, prev.qOrder, { [step]: next }),\n      qStatus: Object.assign({}, prev.qStatus, { [step]: next.length === q.order.length ? \"ok\" : null })\n    }));\n  }\n\n  retryQuiz(step) {\n    this.setState(prev => {\n      const marks = Object.assign({}, prev.marks);\n      this.panelKeys(step).forEach(k => { marks[k] = null; });\n      return {\n        qStatus: Object.assign({}, prev.qStatus, { [step]: null }),\n        qSel: Object.assign({}, prev.qSel, { [step]: null }),\n        qOrder: Object.assign({}, prev.qOrder, { [step]: [] }),\n        marks,\n        phase: \"read\"\n      };\n    });\n    this.scrollTop();\n  }\n\n  collapse() {\n    if (!this.state.expanded) return;\n    clearTimeout(this._t); clearTimeout(this._r);\n    this.setState({ expanded: false, closing: true, reader: false });\n    this._t = setTimeout(() => this.setState({ closing: false }), 500);\n  }\n\n  componentDidMount() {\n    this.onKey = (e) => {\n      if (e.key === \"Escape\" && this.state.expanded) { this.collapse(); return; }\n      if (this.state.expanded) return;\n      if ([\"ArrowDown\", \"ArrowRight\"].indexOf(e.key) >= 0) { e.preventDefault(); this.jump(this.state.active + 1); }\n      if ([\"ArrowUp\", \"ArrowLeft\"].indexOf(e.key) >= 0) { e.preventDefault(); this.jump(this.state.active - 1); }\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n\n  componentWillUnmount() { window.removeEventListener(\"keydown\", this.onKey); clearTimeout(this._t); clearTimeout(this._r); }\n\n  panelKeys(step) {\n    if (this.isFinalStep(step)) return [];\n    return this.M1.steps[step].blocks\n      .map((b, i) => (b.k === \"guide\" ? step + \":\" + i : null))\n      .filter(Boolean);\n  }\n\n  openKeys(step) {\n    if (this.isFinalStep(step)) return [];\n    return this.M1.steps[step].blocks\n      .map((b, i) => (b.k === \"table\" || b.k === \"pair\" ? step + \":\" + i : null))\n      .filter(Boolean);\n  }\n\n  canFinishReading(step) {\n    return this.panelKeys(step).every(k => !!this.state.marks[k])\n      && this.openKeys(step).every(k => !!this.state.opened[k]);\n  }\n\n  canAdvance(step) {\n    return this.canFinishReading(step) && this.quizPassed(step);\n  }\n\n  scrollTop() {\n    const el = document.getElementById(\"m1-scroll\");\n    if (el) el.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  mark(key, value) {\n    this.setState(prev => ({ marks: Object.assign({}, prev.marks, { [key]: prev.marks[key] === value ? null : value }) }));\n  }\n\n  gotoStep(i) {\n    const total = this.M1.steps.length + 1;\n    const t = Math.min(total - 1, Math.max(0, i));\n    if (t > this.state.maxStep + 1) return;\n    if (t > this.state.step && !this.canAdvance(this.state.step)) return;\n    this.setState(prev => ({ step: t, maxStep: Math.max(prev.maxStep, t), phase: \"read\", dir: t >= prev.step ? 1 : -1, tick: (prev.tick || 0) + 1 }));\n    this.scrollTop();\n  }\n\n  jump(i) {\n    if (this.state.expanded) return;\n    const n = this.MODULES.length;\n    const t = Math.min(n - 1, Math.max(0, i));\n    if (t !== this.state.active) this.setState({ active: t });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const n = this.MODULES
